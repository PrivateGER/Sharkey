packages:
  - locales
  - packages/backend
  - packages/frontend
  - packages/frontend-embed
  - packages/frontend-shared
  - packages/megalodon
  - packages/misskey-bubble-game
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/misskey-reversi
  - packages/shared
  - packages/stub
  - packages/sw

# https://pnpm.io/catalogs
catalog:
  "@jest/globals": "30.5.2"
  "@types/jest": "30.0.0"
  "@types/node": "26.6.5"
  "@typescript-eslint/eslint-plugin": "8.71.2"
  "@typescript-eslint/parser": "8.71.2"
  "axios": "1.20.0"
  "eslint": "9.39.5"
  "eslint-plugin-import": "2.32.0"
  "execa": "10.1.1"
  "fast-glob": "3.3.3"
  "file-type": "22.1.1"
  "jest": "30.5.2"
  "jest-environment-node": "30.5.2"
  "jest-mock": "30.5.2"
  "jest-worker": "30.5.1"
  "jest-fetch-mock": "4.2.0"
  "jest-websocket-mock": "2.5.0"
  "js-yaml": "5.4.3"
  "nodemon": "3.1.14"
  "rollup": "4.63.6" # Do not update! Later versions will break Vite - https://activitypub.software/TransFem-org/Sharkey/-/merge_requests/1337#note_21422
  "sanitize-html": "2.18.0"
  "sharp": "0.35.5"
  "systeminformation": "5.33.15"
  "ts-jest": "29.4.14"
  "tsc-alias": "1.9.7"
  "typescript": "5.9.3"
  "uuid": "14.0.3"

allowBuilds:
  # Needed to build/download native components
  '@parcel/watcher': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  argon2: true
  bufferutil: true
  canvas: true
  core-js: true
  cypress: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  re2: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  # Needed because these packages do install-time Vue version selection.
  v-code-diff: true
  vue-demi: true
  # False positives - no build scripts in package code
  '@nestjs/core': false
  msw: false

# https://pnpm.io/settings#packageextensions
packageExtensions:
  "@misskey-dev/eslint-plugin":
    "peerDependencies":
      "@eslint/eslintrc": "3.3.5"

# https://pnpm.io/settings#overrides
overrides:
  # Use drop-in compatible fast-glob everywhere
  "glob": "npm:fast-glob@3.3.3"

  # Prevent silent downgrade to vulnerable version of sharp
  "@misskey-dev/sharp-read-bmp>sharp": "catalog:"

  # Fix incorrect peer-dependency specifier (requests 5.x instead of 5+)
  "typeorm>ioredis": "6.0.0"

  # Stubs and disabled packages.
  # If an unused dependency is never loaded, then use version "-".
  # If an unused dependency *is* loaded, then use version "workspace:stub@*" to avoid import errors.
  "jsonld>@digitalbazaar/http-client": "workspace:stub@*"
  "node-domexception": "workspace:stub@*"
  "parse5": "workspace:stub@*"
  "parse5-htmlparser2-tree-adapter": "workspace:stub@*"
  "parse5-parser-stream": "workspace:stub@*"
  "aiscript-vscode>@aiscript-dev/aiscript-languageserver": "-"
  "aiscript-vscode>vscode-languageclient": "-"

  # re2 lists node-gyp as a production dependency, which brings it into the actual application runtime for no reason.
  # Note: node-gyp is still required at install time under certain environments, so it's mirrored into backend.devDependencies to make sure it works.
  "re2>node-gyp": "-"

# Prompt before auto-generating an exception
minimumReleaseAgeStrict: true
